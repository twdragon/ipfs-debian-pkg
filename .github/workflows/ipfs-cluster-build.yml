on:
    schedule:
        - cron: '00 14 * * 6'
    push:
        branches:
            - 'master'
defaults:
    run:
        shell: bash
env:
    UBUNTU_CODENAME: resolute
jobs:
    version_analyser:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            build_ipfs_cluster: ${{ steps.version_compare.outputs.ipfs_cluster }}
        steps:
            - name: Extract last version from Debian repository and store it in the GitHub CI environment variable
              run: |
                echo -e "# IPFS Cluster Debian Package Builder CI Process \n\nBuild started: $(date +"%a, %d %b %Y %H:%M:%S %z")" >> ${GITHUB_STEP_SUMMARY}
                echo -e "Run ID: \`${GITHUB_RUN_NUMBER}\`" >> ${GITHUB_STEP_SUMMARY}
                echo -e "Workflow YML hash: \`${GITHUB_WORKFLOW_SHA}\`" >> ${GITHUB_STEP_SUMMARY}
                echo -e "Trigger: \`${GITHUB_EVENT_NAME}\`" >> ${GITHUB_STEP_SUMMARY}
                echo -e "\n## Version analyzer\n" >> ${GITHUB_STEP_SUMMARY}
                echo 'Extracting version information from https://ppa.launchpadcontent.net/twdragon/ipfs/ubuntu/dists/resolute/main/source/Sources.gz' >> ${GITHUB_STEP_SUMMARY}
                curl https://ppa.launchpadcontent.net/twdragon/ipfs/ubuntu/dists/resolute/main/source/Sources.gz --output Sources.gz
                gzip --decompress Sources.gz
                IPFSCLUSTER_VERSION_REPO=$(grep -A 10 "^Package: ipfs-cluster" Sources | grep -Po '(?<=^Version: )[0-9]+\.[0-9]+\.[0-9]+')
                echo "IPFSCLUSTER_VERSION_REPO=${IPFSCLUSTER_VERSION_REPO}" >> ${GITHUB_ENV}
                echo -e "\`\`\`\nIPFSCLUSTER_VERSION_REPO=${IPFSCLUSTER_VERSION_REPO}" >> ${GITHUB_STEP_SUMMARY}
            - name: Clone IPFS Cluster
              uses: actions/checkout@v4
              with:
                submodules: 'true'
                fetch-depth: 0
                repository: 'ipfs-cluster/ipfs-cluster'
                path: 'ipfs-cluster'
            - name: Clone mkchangelog
              uses: actions/checkout@v4
              with:
                submodules: 'true'
                fetch-depth: 0
                repository: 'twdragon/mkchangelog'
                path: 'mkchangelog'
            - name: Clone Debian maintaner scripts repository
              uses: actions/checkout@v4
              with:
                path: 'debian-scripts'
            - name: Extract last tagged version from Github repository and store it in the GitHub CI environment variable
              run: |
                echo -e "\nExtracting and analyzing annotated tags from Git repositories." >> ${GITHUB_STEP_SUMMARY}
                cd ipfs-cluster
                IPFSCLUSTER_VERSION=$(../mkchangelog/get-latest-tagged-semver HEAD)
                rm -rf ../mkchangelog
                echo "IPFSCLUSTER_VERSION=${IPFSCLUSTER_VERSION}" >> ${GITHUB_ENV}
                echo -e "\`\`\`\nIPFSCLUSTER_VERSION=${IPFSCLUSTER_VERSION}" >> ${GITHUB_STEP_SUMMARY}
            - name: Version comparison
              id: version_compare
              run: |
                if $(dpkg --compare-versions "${IPFSCLUSTER_VERSION}" "gt" "${IPFSCLUSTER_VERSION_REPO}")
                then
                    echo -e "\n - **IPFS Cluster**: found a release version \`${IPFSCLUSTER_VERSION}\` > \`${IPFSCLUSTER_VERSION_REPO}\`, running build" >> ${GITHUB_STEP_SUMMARY}
                    echo "ipfs_cluster=true" >> "$GITHUB_OUTPUT"
                else
                    echo -e "\n - **IPFS Cluster**: cannot found a release version, release sources for \`${IPFSCLUSTER_VERSION}\` will not be built" >> ${GITHUB_STEP_SUMMARY}
                    echo "ipfs_cluster=false" >> "$GITHUB_OUTPUT"
                fi
    build_ipfs_cluster:
        if: ${{ needs.version_analyzer.outputs.build_ipfs_cluster == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: version_analyser
        steps:
            - name: Install Debian helper software
              run: |
                sudo apt-get update
                sudo apt-get install -y debhelper curl gcc sed gawk dpkg-dev build-essential devscripts
                echo -e "\n## Building IPFS Cluster \n\nInstalled Debian helper packages: \`debhelper curl gcc sed gawk dpkg-dev build-essential devscripts\`" >> ${GITHUB_STEP_SUMMARY}
            - name: Clone IPFS Cluster
              uses: actions/checkout@v4
              with:
                submodules: 'true'
                fetch-depth: 0
                repository: 'ipfs-cluster/ipfs-cluster'
                path: 'ipfs-cluster'
            - name: Parse required Go version
              run: |
                cd ipfs-cluster
                git checkout $(git describe --tags --abbrev=0)
                GO_VERSION=$(grep -Po '(?<=go )[0-9]+\.[0-9]+\.?[0-9]{0,2}$' go.mod)
                echo -e "GO_VERSION=${GO_VERSION}" >> ${GITHUB_ENV}
                echo -e "\nRequired Go version parsed from \`go.mod\`: \`${GO_VERSION}\`" >> ${GITHUB_STEP_SUMMARY}
                cd ..
            - name: Install Go compiler
              uses: actions/setup-go@v5
              with:
                go-version: ${{ env.GO_VERSION }}
            - name: Clone Debian maintaner scripts repository
              uses: actions/checkout@v4
              with:
                path: 'debian-scripts'
            - name: Clone mkchangelog
              uses: actions/checkout@v4
              with:
                submodules: 'true'
                fetch-depth: 0
                repository: 'twdragon/mkchangelog'
                path: 'mkchangelog'
            - name: Compile IPFS Cluster
              run: |
                cd ipfs-cluster
                go mod tidy
                go mod vendor
                mkdir debian
                cp -r ../debian-scripts/ipfs-cluster/* ./debian/
                SHORT_GO_VERSION=$(echo -e "${{ env.GO_VERSION }}" | sed -e 's/\([0-9]\+\)\.\([0-9]\+\)\..*/\1.\2/')
                sed -i -e "s/golang-[0-9]\+\.[0-9]\+/golang-${SHORT_GO_VERSION}/" ./debian/control
                sed -i -e "s/\/go-[0-9]\+\.[0-9]\+/\/go-${SHORT_GO_VERSION}/" ./debian/rules
                chmod +x ./debian/rules
                LC_TIME=en_US.UTF-8 ../mkchangelog/mkchangelog debian/changelog ${{ env.UBUNTU_CODENAME }} ipfs-cluster "IPFS Cluster Developers" info@ipfs.tech "IPFS Community & Contributors" low
                GOFLAGS="--mod=vendor" debuild -b -uc -us -d
                rm ./debian/changelog
                go clean -modcache
                rm -rf vendor/ pkg/
                go mod tidy
                go mod vendor
                LC_TIME=en_US.UTF-8 ../mkchangelog/mkchangelog debian/changelog ${{ env.UBUNTU_CODENAME }} ipfs-cluster "IPFS Cluster Developers" info@ipfs.tech "IPFS Community & Contributors" low
                GOFLAGS="-mod=vendor" debuild -S -uc -us -d
                mkdir packages
                mv -v ../ipfs-cluster*.* packages/
                echo -e "IPFS Cluster compiled in:\n\`\`\`" >> ${GITHUB_STEP_SUMMARY}
                ls -lh packages/ >> ${GITHUB_STEP_SUMMARY}
                echo -e "\`\`\`\n"
                cd ..
            - name: Upload unsigned packages
              uses: actions/upload-artifact@v4
              with:
                name: ipfs-cluster-ubuntu-ppa
                path: ipfs-cluster/packages/ipfs-cluster*.*
            - name: Sign the source package
              run: |
                cd ipfs-cluster/packages
                echo -e "\nSigning IPFS Cluster:\n\`\`\`\n $(find . -maxdepth 1 -name 'ipfs-cluster*_source.changes' -regextype egrep -exec cat {} \;) \n\`\`\`" >> ${GITHUB_STEP_SUMMARY}
                echo "${{ secrets.DEBSIGN_SECRET_KEY }}" | base64 -d > secret
                gpg --import secret
                rm -f secret
                debsign -k "${{ secrets.DEBSIGN_SECRET_FP }}" $(find . -maxdepth 1 -name 'ipfs-cluster*_source.changes' -regextype egrep)
                cd ../..
            - name: Upload the built package to PPA
              run: |
                cd ipfs-cluster/packages
                dput ppa:twdragon/ipfs $(find . -maxdepth 1 -name 'ipfs-cluster*_source.changes' -regextype egrep)
                cd ../..
